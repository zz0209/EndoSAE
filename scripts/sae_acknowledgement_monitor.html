<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAE 确认记忆 · 实验进度</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1b2430;--muted:#aab8ca;--accent:#87baff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2fa;font:15px/1.65 system-ui,"Microsoft Yahei",sans-serif}main{max-width:1150px;margin:32px auto;padding:0 22px}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0}.muted,small{color:var(--muted)}.panel{padding:22px;background:var(--panel);border-radius:15px;margin:20px 0}.line{display:flex;justify-content:space-between;gap:20px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{padding:18px;border:1px solid #344356;border-radius:12px}.card.active{border-color:var(--accent)}.label{font-weight:600;font-size:16px}.eta{color:#bdd8ff;margin:10px 0 0}small{display:block}.good{color:#a2dfb9}.warn{color:#ffd39c}progress{appearance:none;width:100%;height:9px;border:0;background:#344356;border-radius:8px;overflow:hidden;margin:10px 0 2px}progress::-webkit-progress-bar{background:#344356}progress::-webkit-progress-value{background:var(--accent)}.big{font-size:28px;font-variant-numeric:tabular-nums}footer{font-size:13px;color:var(--muted);margin:24px 0}#error:empty{display:none}a{color:#bdd8ff}@media(max-width:600px){main{padding:0 14px}.panel{padding:17px}h1{font-size:24px}.line{align-items:flex-start}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>SAE 确认记忆 · 实验进度</h1><p class="muted">同一确认输入 · 同一提示规则 · SAE 与普通表示的直接比较</p><small id="updated">连接中…</small>
<section class="panel"><div class="line"><div><h2 id="state">读取作业状态</h2><div id="active"></div></div><span id="count" class="big">—</span></div><progress id="bar" value="0" max="1"></progress><small>已完成阶段 / 全部阶段</small><p class="eta" id="totalEta"></p><small id="process"></small><p id="error" class="warn"></p></section>
<section class="panel"><h2>各阶段进度与预计完成时间</h2><div id="stages" class="grid"></div></section>
<footer>每 5 秒更新。预计时间依据实际小样本运行速度和已完成阶段调整，包含排队时间；暂停、失败或进程退出后停止估算。训练和评价保存断点，已完成阶段可复用。完成后保留此页，方便查看结果状态。种子重复检验训练稳定性，独立单位为 procedure。</footer>
</main><script>
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('zh-CN');
const labels={READY:'准备运行',RUNNING:'运行中',QUEUED:'等待',COMPLETE:'已完成',FAILED:'执行失败',PAUSED:'已暂停',INTERRUPTED:'进程已退出'};
function duration(s){let m=Math.ceil(s/60);return m<1?'不足 1 分钟':m<60?m+' 分钟':Math.floor(m/60)+' 小时 '+m%60+' 分钟'}
function time(t){return new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function eta(r){return r.status==='COMPLETE'?'已完成':r.eta_at?`预计 ${time(r.eta_at)} 完成 · 约 ${duration(r.eta_seconds)}${r.active?'':' · 含排队'}`:'等待运行速度记录'}
async function update(){try{let response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error(response.status);let s=await response.json();$('updated').textContent='更新于 '+new Date(s.time).toLocaleTimeString('zh-CN');$('count').textContent=s.completed+' / '+s.total;$('bar').max=s.total;$('bar').value=s.completed;$('state').textContent=labels[s.state.status]||s.state.status;$('active').textContent=s.rows.find(x=>x.active)?.label||'';$('process').textContent=s.state.pid?'协调进程 '+s.state.pid:'';$('error').textContent=s.state.status==='FAILED'?'阶段日志：'+s.state.log:'';$('totalEta').textContent=s.state.status==='COMPLETE'?'全部计算与结果汇总已完成':s.eta_seconds!=null?'整批预计 '+time(new Date(new Date(s.time).getTime()+s.eta_seconds*1000))+' 完成 · 约 '+duration(s.eta_seconds):'预计时间将在实际速度记录可用后显示';$('stages').replaceChildren();for(let r of s.rows){let card=document.createElement('div');card.className='card'+(r.active?' active':'');let title=document.createElement('div');title.className='label';title.textContent=r.label;let p=document.createElement('progress');p.value=r.completed;p.max=r.total;let count=document.createElement('small');count.textContent=fmt.format(r.completed)+' / '+fmt.format(r.total)+' '+r.unit+' · '+(labels[r.status]||r.status);let e=document.createElement('div');e.className='eta';e.textContent=eta(r);card.append(title,p,count,e);$('stages').append(card)}}catch(e){$('updated').textContent='连接中断 · 进度停止更新';}setTimeout(update,5000)}update();
</script></body></html>
